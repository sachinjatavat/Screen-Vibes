<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Screen Vibes Overlay</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="overlay.js"></script>
</body>
</html>
