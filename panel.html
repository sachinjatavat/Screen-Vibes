<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Screen Vibes - Developed By Sachin</title>
<style>
  :root {
    --clay-bg: #1c1c2b;
    --card-clay: #26263b;
    --card-shadow: 12px 18px 30px rgba(0, 0, 0, 0.45), -4px -4px 10px rgba(255, 255, 255, 0.05), inset 3px 3px 6px rgba(255, 255, 255, 0.12), inset -4px -4px 8px rgba(0, 0, 0, 0.5);
    
    --btn-clay: 6px 9px 18px rgba(0, 0, 0, 0.4), -2px -2px 6px rgba(255, 255, 255, 0.08), inset 2px 2px 4px rgba(255, 255, 255, 0.16), inset -3px -3px 6px rgba(0, 0, 0, 0.45);
    --btn-hover: 8px 12px 22px rgba(0, 0, 0, 0.48), -3px -3px 8px rgba(255, 255, 255, 0.12), inset 2px 2px 5px rgba(255, 255, 255, 0.22), inset -3px -3px 6px rgba(0, 0, 0, 0.4);
    --btn-active: inset 4px 4px 8px rgba(0, 0, 0, 0.65), inset -2px -2px 4px rgba(255, 255, 255, 0.06), 2px 3px 6px rgba(0, 0, 0, 0.35);
    
    --groove-clay: inset 4px 4px 8px rgba(0, 0, 0, 0.8), inset -2px -2px 4px rgba(255, 255, 255, 0.05);
    --thumb-clay: 4px 6px 14px rgba(0, 0, 0, 0.45), 0 0 10px rgba(0, 245, 255, 0.4), inset 2px 2px 4px #ffffff, inset -3px -3px 5px rgba(0, 140, 180, 0.7);

    --accent: #00f5ff;
    --accent-pink: #ff00d4;
    --text-primary: #f2f2fa;
    --text-muted: #9a9ab8;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    padding: 16px 18px 30px;
    background: var(--clay-bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select: none;
    overflow-x: hidden;
  }
  
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--clay-bg); }
  ::-webkit-scrollbar-thumb {
    background: #33334d;
    border-radius: 12px;
    box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.1);
  }
  ::-webkit-scrollbar-thumb:hover { background: #444466; }

  /* ========================================= */
  /* PROMINENT TOP DEVELOPER HEADER CARD       */
  /* ========================================= */
  .developer-header-card {
    background: #2b2b42;
    border-radius: 26px;
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: var(--card-shadow);
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .app-clay-icon {
    width: 44px;
    height: 44px;
    border-radius: 16px;
    background: linear-gradient(135deg, #00d2df 0%, #d800c2 100%);
    box-shadow: 4px 6px 12px rgba(0, 0, 0, 0.4), inset 2px 2px 4px rgba(255, 255, 255, 0.4), inset -2px -2px 4px rgba(0, 0, 0, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .brand-text h1 {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 3px;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #00f5ff 0%, #ff00e5 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-text .app-sub {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0;
  }
  .dev-badge-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  .dev-name-pill {
    background: #363650;
    color: #00f5ff;
    padding: 7px 15px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    box-shadow: var(--btn-clay);
    border: 1px solid rgba(0, 245, 255, 0.3);
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .dev-name-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #00f5ff;
    box-shadow: 0 0 8px #00f5ff;
  }
  .status-pill {
    background: #1c1c2b;
    box-shadow: var(--groove-clay);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    color: #8c8cb0;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-pill .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00f5ff;
    box-shadow: 0 0 6px #00f5ff;
  }

  /* ========================================= */
  /* CLAYMORPHISM CARDS                        */
  /* ========================================= */
  .card {
    background: var(--card-clay);
    border-radius: 28px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--card-shadow);
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #d2d2ea;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ========================================= */
  /* CLAY LAPTOP PREVIEW CHASSIS               */
  /* ========================================= */
  .preview-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 12px 0 18px;
  }
  .laptop-bezel {
    position: relative;
    background: #11111a;
    border: 5px solid #34344d;
    border-radius: 16px;
    padding: 6px;
    box-shadow: 8px 12px 24px rgba(0, 0, 0, 0.6), inset 2px 2px 4px rgba(255, 255, 255, 0.1), inset -3px -3px 5px rgba(0, 0, 0, 0.7);
  }
  .screen-reflection {
    position: absolute;
    top: 6px;
    left: 6px;
    right: 6px;
    height: 42px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 100%);
    pointer-events: none;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  #previewCanvas {
    display: block;
    background: #08080d;
    border-radius: 10px;
  }
  .preview-badge {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(18, 18, 28, 0.88);
    box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.1), 0 2px 6px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 10px;
    color: #a0a0c4;
    letter-spacing: 0.05em;
    font-weight: 700;
  }
  .laptop-base {
    width: 260px;
    height: 8px;
    background: #34344d;
    border-radius: 0 0 12px 12px;
    margin: 0 auto;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.45), inset 1.5px 1.5px 2px rgba(255, 255, 255, 0.1);
    border-top: 1px solid #444464;
  }

  /* ========================================= */
  /* CLAY DIRECTION BUTTONS                    */
  /* ========================================= */
  .dir-group {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .dir-btn {
    background: #323249;
    border: 1px solid rgba(255, 255, 255, 0.07);
    color: var(--text-primary);
    padding: 13px 10px;
    border-radius: 18px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    box-shadow: var(--btn-clay);
    transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .dir-btn .icon {
    font-size: 20px;
    line-height: 1;
  }
  .dir-btn:hover {
    background: #3c3c58;
    transform: translateY(-2px);
    box-shadow: var(--btn-hover);
  }
  .dir-btn:active {
    transform: translateY(2px);
    box-shadow: var(--btn-active);
  }
  .dir-btn.active {
    background: linear-gradient(135deg, #00d2df 0%, #d800c2 100%);
    border-color: rgba(255, 255, 255, 0.35);
    color: #ffffff;
    box-shadow: 0 8px 24px rgba(0, 245, 255, 0.45), inset 3px 3px 6px rgba(255, 255, 255, 0.4), inset -3px -3px 6px rgba(0, 0, 0, 0.4);
  }

  /* ========================================= */
  /* CLAY CONTROLS & SLIDERS                   */
  /* ========================================= */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 14px 0;
    font-size: 13px;
  }
  .row label {
    color: #d6d6ec;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .val-badge {
    color: #00f5ff;
    font-size: 12px;
    font-weight: 800;
    min-width: 50px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    background: #171724;
    padding: 4px 10px;
    border-radius: 12px;
    box-shadow: var(--groove-clay);
    border: 1px solid rgba(255, 255, 255, 0.04);
  }

  /* Clay Sliders */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 170px;
    height: 12px;
    background: #161623;
    border-radius: 12px;
    outline: none;
    box-shadow: var(--groove-clay);
    border: 1px solid rgba(255, 255, 255, 0.04);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #00f5ff;
    cursor: pointer;
    box-shadow: var(--thumb-clay);
    transition: transform 0.15s, background 0.15s;
    border: none;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    background: #52f8ff;
  }

  /* Clay Toggle Switch */
  .switch {
    position: relative;
    display: inline-block;
    width: 54px;
    height: 30px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #171725;
    transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 30px;
    box-shadow: var(--groove-clay);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 22px;
    width: 22px;
    left: 4px;
    bottom: 3.5px;
    background: #9090af;
    transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 50%;
    box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.45), inset 2px 2px 3px rgba(255, 255, 255, 0.4), inset -2px -2px 3px rgba(0, 0, 0, 0.4);
  }
  input:checked + .slider {
    background-color: #133a46;
    box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.75), inset -1.5px -1.5px 3px rgba(0, 245, 255, 0.25);
  }
  input:checked + .slider:before {
    transform: translateX(24px);
    background: #00f5ff;
    box-shadow: 0 0 12px #00f5ff, inset 2px 2px 4px #ffffff, inset -2px -2px 4px rgba(0, 160, 200, 0.6);
  }

  /* Clay Select Dropdowns */
  select {
    background: #323249;
    color: var(--text-primary);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 8px 16px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    outline: none;
    cursor: pointer;
    box-shadow: var(--btn-clay);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  select:hover {
    transform: translateY(-1px);
    box-shadow: var(--btn-hover);
  }
  select:focus {
    border-color: #00f5ff;
  }

  .color-picker-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type=color] {
    -webkit-appearance: none;
    appearance: none;
    width: 44px;
    height: 32px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    background: none;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    box-shadow: var(--btn-clay);
    transition: transform 0.15s;
  }
  input[type=color]:hover { transform: scale(1.08); }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 10px; }

  /* ========================================= */
  /* CLAY PRESET BUTTONS                       */
  /* ========================================= */
  .presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .preset {
    height: 44px;
    border-radius: 16px;
    border: 2px solid transparent;
    cursor: pointer;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    box-shadow: 4px 6px 14px rgba(0, 0, 0, 0.45), inset 2px 2px 4px rgba(255, 255, 255, 0.3), inset -2px -2px 4px rgba(0, 0, 0, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s;
    outline: none;
  }
  .preset:hover {
    border-color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 6px 10px 18px rgba(0, 0, 0, 0.55), inset 2px 2px 4px rgba(255, 255, 255, 0.4), inset -2px -2px 4px rgba(0, 0, 0, 0.4);
  }
  .preset:active {
    transform: translateY(1px);
    box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.6);
  }

  /* ========================================= */
  /* CLAY CHECKBOXES                           */
  /* ========================================= */
  .edges-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 13px;
  }
  .edge-checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #323249;
    padding: 11px 15px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    cursor: pointer;
    box-shadow: var(--btn-clay);
    font-weight: 700;
    transition: transform 0.15s, background 0.15s;
  }
  .edge-checkbox:hover {
    transform: translateY(-1px);
    background: #3a3a55;
  }
  .edge-checkbox input {
    cursor: pointer;
    accent-color: #00f5ff;
    width: 18px;
    height: 18px;
  }

  .collapsible-header {
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .collapse-arrow {
    transition: transform 0.2s ease;
    font-size: 12px;
    color: var(--text-muted);
  }
  .collapsed .collapse-arrow { transform: rotate(-90deg); }
  .collapsed + .collapsible-body { display: none; }
</style>
</head>
<body>

  <!-- ========================================= -->
  <!-- UNMISSABLE CLAYMORPHIC TOP HEADER         -->
  <!-- ========================================= -->
  <div class="developer-header-card">
    <div class="brand-left">
      <div class="app-clay-icon">✨</div>
      <div class="brand-text">
        <h1>Screen Vibes</h1>
        <p class="app-sub">Ambient RGB Edges & Music Visualizer</p>
      </div>
    </div>
    <div class="dev-badge-wrap">
      <div class="dev-name-pill">
        <span class="dot"></span>
        <span>- Developed By Sachin</span>
      </div>
      <div class="status-pill" id="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Wave Running</span>
      </div>
    </div>
  </div>

  <!-- CARD 1: Traveling Light Wave -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <span>💫</span> Traveling Light Wave
      </div>
      <label class="switch">
        <input type="checkbox" id="waveEnabled">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Mini Visual Preview -->
    <div class="preview-wrapper">
      <div class="laptop-bezel">
        <div class="screen-reflection"></div>
        <canvas id="previewCanvas" width="240" height="135"></canvas>
        <div class="preview-badge" id="previewBadge">↻ CW 1.0x</div>
      </div>
      <div class="laptop-base"></div>
    </div>

    <!-- Direction Selector (Clockwise, Anticlockwise, Dual Waves) -->
    <div class="dir-group">
      <button type="button" class="dir-btn" id="btn-cw" title="Single Light Wave Clockwise">
        <span class="icon">↻</span>
        <span>Clockwise</span>
      </button>
      <button type="button" class="dir-btn" id="btn-ccw" title="Single Light Wave Anticlockwise">
        <span class="icon">↺</span>
        <span>Anticlockwise</span>
      </button>
      <button type="button" class="dir-btn" id="btn-dual" title="Two Light Waves Moving In Opposite Directions Intersecting and Crossing">
        <span class="icon">⇄</span>
        <span>Dual Waves</span>
      </button>
    </div>

    <!-- Motion Controls -->
    <div class="row">
      <label>Animation Speed</label>
      <input type="range" id="waveSpeed" min="0.2" max="3.0" step="0.05">
      <span class="val-badge" id="waveSpeedVal">1.0x</span>
    </div>

    <div class="row">
      <label>Wave & Trail Length</label>
      <input type="range" id="waveLength" min="0.10" max="0.80" step="0.02">
      <span class="val-badge" id="waveLengthVal">35%</span>
    </div>

    <div class="row">
      <label>Glow Intensity</label>
      <input type="range" id="waveGlow" min="0.2" max="2.0" step="0.05">
      <span class="val-badge" id="waveGlowVal">100%</span>
    </div>

    <div class="row">
      <label>Border Thickness</label>
      <input type="range" id="waveThickness" min="4" max="50" step="1">
      <span class="val-badge" id="waveThicknessVal">18px</span>
    </div>

    <div class="row">
      <label>Wave Color Style</label>
      <select id="waveColorMode">
        <option value="rainbow">🌈 RGB Rainbow Spectrum</option>
        <option value="gradient">🎨 Dual Gradient (Color 1 → 2)</option>
        <option value="head-trail">✨ Luminous Head + Trail</option>
        <option value="solid">💡 Solid Neon Hue</option>
        <option value="sync">🎵 Sync with Audio Colors</option>
      </select>
    </div>

    <div class="row" id="row-wave-head">
      <label>Wave Head Color</label>
      <div class="color-picker-wrap">
        <input type="color" id="waveHeadColor">
      </div>
    </div>

    <div class="row" id="row-wave-c1">
      <label id="label-wave-c1">Wave Color 1</label>
      <div class="color-picker-wrap">
        <input type="color" id="waveColor1">
      </div>
    </div>

    <div class="row" id="row-wave-c2">
      <label id="label-wave-c2">Wave Color 2</label>
      <div class="color-picker-wrap">
        <input type="color" id="waveColor2">
      </div>
    </div>
  </div>

  <!-- CARD 2: Quick Presets -->
  <div class="card">
    <div class="card-title" style="margin-bottom: 14px;">
      <span>🎨</span> Theme Presets
    </div>
    <div class="presets" id="presets"></div>
  </div>

  <!-- CARD 3: Audio Reactive Vibe -->
  <div class="card">
    <div class="card-header collapsible-header" id="audio-header">
      <div class="card-title">
        <span>🎵</span> Audio Edge Visualizer
      </div>
      <span class="collapse-arrow">▼</span>
    </div>

    <div class="collapsible-body" id="audio-body">
      <div class="row">
        <label>Visualizer Style</label>
        <select id="mode">
          <option value="bars">Bars</option>
          <option value="wave">Wave</option>
          <option value="glow">Glow</option>
          <option value="pulse">Pulse (Bass)</option>
          <option value="none">Off (Light Wave Only)</option>
        </select>
      </div>

      <div class="row">
        <label>Audio Color 1</label>
        <input type="color" id="color1">
      </div>

      <div class="row">
        <label>Audio Color 2</label>
        <input type="color" id="color2">
      </div>

      <div class="row">
        <label>Audio Rainbow Mode</label>
        <input type="checkbox" id="rainbow" style="accent-color: #00f5ff; width: 18px; height: 18px;">
      </div>

      <div class="row">
        <label>Audio Sensitivity</label>
        <input type="range" id="sensitivity" min="0.3" max="3" step="0.05">
        <span class="val-badge" id="sensitivityVal">1.30</span>
      </div>

      <div class="row">
        <label>Audio Height / Size</label>
        <input type="range" id="thickness" min="40" max="400" step="5">
        <span class="val-badge" id="thicknessVal">140px</span>
      </div>

      <div class="row">
        <label>Audio Smoothness</label>
        <input type="range" id="smoothing" min="0.2" max="0.92" step="0.01">
        <span class="val-badge" id="smoothingVal">0.70</span>
      </div>

      <div style="margin-top: 16px; margin-bottom: 10px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 0.06em;">
        Active Audio Edges
      </div>
      <div class="edges-grid">
        <label class="edge-checkbox"><input type="checkbox" id="edge-top"> Top Edge</label>
        <label class="edge-checkbox"><input type="checkbox" id="edge-bottom"> Bottom Edge</label>
        <label class="edge-checkbox"><input type="checkbox" id="edge-left"> Left Edge</label>
        <label class="edge-checkbox"><input type="checkbox" id="edge-right"> Right Edge</label>
      </div>
    </div>
  </div>

  <!-- CARD 4: Displays & System -->
  <div class="card">
    <div class="card-title" style="margin-bottom: 14px;">
      <span>🖥️</span> Displays & System
    </div>
    <div class="row">
      <label>Display Target</label>
      <select id="displayMode">
        <option value="all">All Connected Displays</option>
        <option value="primary">Primary Display Only</option>
      </select>
    </div>
    <div class="row">
      <label>Start with Windows (Auto-launch)</label>
      <label class="switch">
        <input type="checkbox" id="autoStart">
        <span class="slider"></span>
      </label>
    </div>
  </div>

<script src="panel.js"></script>
</body>
</html>
