<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Screen Vibes - Developed By Sachin</title>
<style>
  :root {
    --chassis-bg: #edf1f6;
    --panel-bg: linear-gradient(180deg, #ffffff 0%, #f6f8fc 65%, #edf1f7 100%);
    --card-border: #c8d3e2;
    --card-shadow: inset 0 1px 0 #ffffff, inset 0 -1px 0 #dbe2ed, 0 1px 3px rgba(18, 28, 48, 0.05), 0 8px 24px rgba(18, 28, 48, 0.07);
    
    --btn-normal: linear-gradient(180deg, #ffffff 0%, #f4f6fa 45%, #dde4ef 100%);
    --btn-border: #b2bfd4;
    --btn-shadow: inset 0 1px 0 #ffffff, inset 0 -2px 0 #cbd5e4, 0 3px 6px rgba(18, 28, 48, 0.1), 0 1px 2px rgba(18, 28, 48, 0.06);
    
    --btn-hover: linear-gradient(180deg, #ffffff 0%, #f8faff 45%, #e4ebf5 100%);
    --btn-active: linear-gradient(180deg, #d3dae7 0%, #e4eaf4 100%);
    --btn-active-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(0, 0, 0, 0.15), 0 1px 0 #ffffff;
    
    --groove-bg: linear-gradient(180deg, #bdc8d7 0%, #d8e2ee 60%, #edf2f9 100%);
    --groove-border: #abb9cd;
    --groove-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.25), inset 0 1px 1px rgba(15, 23, 42, 0.15), 0 1px 0 #ffffff;
    
    --thumb-knob: radial-gradient(circle at 35% 30%, #ffffff 0%, #e8edf5 45%, #b4c0d4 85%, #94a3bc 100%);
    --thumb-border: #7c8b9f;
    --thumb-shadow: 0 3px 7px rgba(15, 23, 42, 0.24), 0 1px 2px rgba(15, 23, 42, 0.12), inset 0 1px 1px #ffffff, inset 0 -1px 2px rgba(0, 0, 0, 0.15);

    --accent-blue: #0284c7;
    --accent-blue-active: linear-gradient(180deg, #0284c7 0%, #0369a1 55%, #075985 100%);
    --text-primary: #192130;
    --text-secondary: #475569;
    --text-muted: #64748b;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    padding: 16px 18px 30px;
    background: var(--chassis-bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select: none;
    overflow-x: hidden;
  }
  
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #e2e8f2; }
  ::-webkit-scrollbar-thumb {
    background: #b4c0d2;
    border-radius: 8px;
    border: 2px solid #e2e8f2;
  }
  ::-webkit-scrollbar-thumb:hover { background: #96a5bc; }

  /* ========================================= */
  /* SKEUOMORPHIC ENGRAVED TOP PLAQUE          */
  /* ========================================= */
  .developer-header-card {
    position: relative;
    background: var(--panel-bg);
    border-radius: 18px;
    padding: 16px 20px;
    margin-bottom: 16px;
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  
  /* Metallic Corner Screws with 45deg Slot */
  .hardware-screw {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d8e0ec 50%, #9aa6b8 100%);
    border: 1px solid #8290a4;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.15), inset 0 1px 0 #ffffff;
    pointer-events: none;
  }
  .hardware-screw::after {
    content: "";
    position: absolute;
    top: 3.5px;
    left: 1.5px;
    width: 5px;
    height: 1px;
    background: #505c70;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    transform: rotate(45deg);
  }
  .hardware-screw.top-left { top: 8px; left: 8px; }
  .hardware-screw.top-right { top: 8px; right: 8px; }
  .hardware-screw.bottom-left { bottom: 8px; left: 8px; }
  .hardware-screw.bottom-right { bottom: 8px; right: 8px; }

  .brand-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .app-skeuo-icon {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(180deg, #ffffff 0%, #e2e8f2 100%);
    border: 1px solid #b8c4d6;
    box-shadow: inset 0 1px 0 #ffffff, inset 0 -1px 0 #cbd5e4, 0 3px 7px rgba(18, 28, 48, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .brand-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-title-row h1 {
    font-size: 20px;
    font-weight: 900;
    margin: 0;
    letter-spacing: -0.02em;
    color: #141c2b;
    text-shadow: 0 1px 0 #ffffff;
  }
  .version-tag {
    background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
    color: #ffffff;
    font-size: 9px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: 0.05em;
    box-shadow: 0 1px 3px rgba(2, 132, 199, 0.35);
  }
  .brand-text .app-sub {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 3px 0 0;
    text-shadow: 0 1px 0 #ffffff;
  }
  
  .dev-badge-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
  }
  .dev-name-pill {
    background: linear-gradient(180deg, #ffffff 0%, #e8edf6 100%);
    color: #01579b;
    padding: 6px 14px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: 1px solid #b0bcd0;
    box-shadow: inset 0 1px 0 #ffffff, inset 0 -1px 0 #cbd5e4, 0 2px 5px rgba(18, 28, 48, 0.08);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    text-shadow: 0 1px 0 #ffffff;
  }
  .dev-name-pill .plaque-rivet {
    color: #f59e0b;
    font-size: 11px;
    filter: drop-shadow(0 1px 0 #ffffff);
  }
  .status-pill {
    background: #e2e8f2;
    box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.15), 0 1px 0 #ffffff;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    color: #475569;
    border: 1px solid #b8c4d6;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }
  .status-pill .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 7px #10b981, inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }

  /* ========================================= */
  /* SKEUOMORPHIC HARDWARE CARDS               */
  /* ========================================= */
  .card {
    background: var(--panel-bg);
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 16px;
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #e2e8f4;
  }
  .card-title {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #242c3d;
    text-shadow: 0 1px 0 #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ========================================= */
  /* ALUMINUM LAPTOP PREVIEW BEZEL             */
  /* ========================================= */
  .preview-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 10px 0 16px;
  }
  .laptop-bezel {
    position: relative;
    background: #0d1117;
    border: 4px solid #d4dae6;
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 1px 0 #ffffff, 0 8px 24px rgba(18, 28, 48, 0.18), 0 2px 4px rgba(18, 28, 48, 0.1);
  }
  .screen-reflection {
    position: absolute;
    top: 6px;
    left: 6px;
    right: 6px;
    height: 44px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.03) 40%, transparent 60%);
    pointer-events: none;
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
  }
  #previewCanvas {
    display: block;
    background: #06080e;
    border-radius: 8px;
  }
  .preview-badge {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: rgba(13, 17, 23, 0.88);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.18);
    padding: 3px 9px;
    border-radius: 8px;
    font-size: 10px;
    color: #00f5ff;
    letter-spacing: 0.05em;
    font-weight: 700;
  }
  .laptop-base {
    width: 260px;
    height: 8px;
    background: linear-gradient(180deg, #d8dee8 0%, #bac4d4 100%);
    border-radius: 0 0 10px 10px;
    margin: 0 auto;
    border: 1px solid #a8b4c6;
    border-top: none;
    box-shadow: 0 4px 10px rgba(18, 28, 48, 0.12);
  }

  /* ========================================= */
  /* PUSH-BUTTONS & DIRECTION SWITCHERS        */
  /* ========================================= */
  .dir-group {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .dir-btn {
    background: var(--btn-normal);
    border: 1px solid var(--btn-border);
    color: #1e2432;
    padding: 12px 10px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    box-shadow: var(--btn-shadow);
    text-shadow: 0 1px 0 #ffffff;
    transition: all 0.15s ease;
    user-select: none;
  }
  .dir-btn .icon {
    font-size: 20px;
    line-height: 1;
    filter: drop-shadow(0 1px 0 #ffffff);
  }
  .dir-btn:hover {
    background: var(--btn-hover);
    box-shadow: inset 0 1px 0 #ffffff, inset 0 -2px 0 #cbd5e4, 0 5px 12px rgba(18, 28, 48, 0.14);
    transform: translateY(-1px);
  }
  .dir-btn:active {
    background: var(--btn-active);
    box-shadow: var(--btn-active-shadow);
    transform: translateY(2px);
  }
  .dir-btn.active {
    background: var(--accent-blue-active);
    border-color: #0c4a6e;
    color: #ffffff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.3), 0 0 16px rgba(2, 132, 199, 0.4), 0 4px 10px rgba(18, 28, 48, 0.18);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  }
  .dir-btn.active .icon {
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.7));
  }

  /* ========================================= */
  /* RECESSED GROOVE SLIDERS & CONTROLS        */
  /* ========================================= */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 12px 0;
    font-size: 13px;
  }
  .row label {
    color: var(--text-secondary);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 7px;
    text-shadow: 0 1px 0 #ffffff;
  }
  .val-badge {
    color: #0284c7;
    font-size: 12px;
    font-weight: 800;
    min-width: 54px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    background: #e2e8f2;
    padding: 3px 8px;
    border-radius: 8px;
    box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.16), 0 1px 0 #ffffff;
    border: 1px solid #b8c4d6;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  /* Recessed Grooved Range Slider */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 170px;
    height: 10px;
    background: var(--groove-bg);
    border-radius: 999px;
    outline: none;
    border: 1px solid var(--groove-border);
    box-shadow: var(--groove-shadow);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--thumb-knob);
    cursor: pointer;
    border: 1px solid var(--thumb-border);
    box-shadow: var(--thumb-shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.12);
    box-shadow: 0 4px 10px rgba(15, 23, 42, 0.3), 0 1px 3px rgba(15, 23, 42, 0.15), inset 0 1px 1px #ffffff;
  }
  input[type=range]::-webkit-slider-thumb:active {
    transform: scale(1.05);
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #dce3ee 45%, #a6b4ca 85%, #8897b0 100%);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.3), inset 0 1px 2px rgba(0, 0, 0, 0.2);
  }

  /* Tactile Rocker / Slide Switch */
  .switch {
    position: relative;
    display: inline-block;
    width: 52px;
    height: 28px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: linear-gradient(180deg, #bdc8d7 0%, #d8e2ee 100%);
    transition: .25s ease;
    border-radius: 20px;
    border: 1px solid #abb9cd;
    box-shadow: inset 0 2px 4px rgba(15, 23, 42, 0.28), 0 1px 0 #ffffff;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 20px;
    width: 20px;
    left: 3px;
    bottom: 3px;
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #eef2f9 55%, #c2cde0 100%);
    transition: .25s ease;
    border-radius: 50%;
    border: 1px solid #9aa7ba;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.22), inset 0 1px 1px #ffffff;
  }
  input:checked + .slider {
    background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
    border-color: #075985;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3), 0 0 10px rgba(2, 132, 199, 0.35), 0 1px 0 #ffffff;
  }
  input:checked + .slider:before {
    transform: translateX(24px);
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f0f4fa 55%, #dce4f0 100%);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25), inset 0 1px 1px #ffffff;
  }

  /* Tactile Select Dropdowns */
  select {
    background: var(--btn-normal);
    color: var(--text-primary);
    border: 1px solid var(--btn-border);
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    outline: none;
    cursor: pointer;
    box-shadow: var(--btn-shadow);
    text-shadow: 0 1px 0 #ffffff;
    transition: all 0.15s ease;
  }
  select:hover {
    background: var(--btn-hover);
  }
  select:focus {
    border-color: #0284c7;
    box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.25);
  }

  .color-picker-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type=color] {
    -webkit-appearance: none;
    appearance: none;
    width: 44px;
    height: 32px;
    border: 1px solid #b8c4d6;
    border-radius: 10px;
    background: #ffffff;
    padding: 3px;
    cursor: pointer;
    overflow: hidden;
    box-shadow: var(--btn-shadow);
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 6px; }

  /* ========================================= */
  /* HARDWARE SYNTH PRESET BUTTONS             */
  /* ========================================= */
  .presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .preset {
    height: 42px;
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.18);
    cursor: pointer;
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.25), 0 3px 7px rgba(18, 28, 48, 0.14);
    transition: transform 0.15s, box-shadow 0.15s;
    outline: none;
  }
  .preset:hover {
    transform: translateY(-1.5px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 -2px 0 rgba(0, 0, 0, 0.25), 0 5px 12px rgba(18, 28, 48, 0.2);
  }
  .preset:active {
    transform: translateY(1.5px);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.35);
  }

  /* ========================================= */
  /* SKEUOMORPHIC CHECKBOX TILES               */
  /* ========================================= */
  .edges-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 13px;
  }
  .edge-checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--btn-normal);
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--btn-border);
    cursor: pointer;
    box-shadow: var(--btn-shadow);
    font-weight: 700;
    color: #1e2432;
    text-shadow: 0 1px 0 #ffffff;
    transition: all 0.15s ease;
  }
  .edge-checkbox:hover {
    background: var(--btn-hover);
  }
  .edge-checkbox input {
    cursor: pointer;
    accent-color: #0284c7;
    width: 17px;
    height: 17px;
  }

  .collapsible-header {
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .collapse-arrow {
    transition: transform 0.2s ease;
    font-size: 12px;
    color: var(--text-muted);
  }
  .collapsed .collapse-arrow { transform: rotate(-90deg); }
  .collapsed + .collapsible-body { display: none; }
</style>
</head>
<body>

  <!-- ========================================= -->
  <!-- ENGRAVED WHITE SKEUOMORPHIC TOP HEADER    -->
  <!-- ========================================= -->
  <div class="developer-header-card">
    <div class="hardware-screw top-left"></div>
    <div class="hardware-screw top-right"></div>
    <div class="hardware-screw bottom-left"></div>
    <div class="hardware-screw bottom-right"></div>

    <div class="brand-left">
      <div class="app-skeuo-icon">⚡</div>
      <div class="brand-text">
        <div class="brand-title-row">
          <h1>Screen Vibes</h1>
          <span class="version-tag">PRO</span>
        </div>
        <p class="app-sub">Ambient RGB Edges & Music Visualizer</p>
      </div>
    </div>
    
    <div class="dev-badge-wrap">
      <div class="dev-name-pill" title="Software Author & Creator">
        <span class="plaque-rivet">★</span>
        <span>- Developed By Sachin</span>
        <span class="plaque-rivet">★</span>
      </div>
      <div class="status-pill" id="status-pill">
        <span class="status-dot"></span>
        <span id="status-text">Wave Running</span>
      </div>
    </div>
  </div>

  <!-- CARD 1: Traveling Light Wave -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <span>💫</span> Traveling Light Wave
      </div>
      <label class="switch">
        <input type="checkbox" id="waveEnabled">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Mini Visual Preview (Hardware Laptop Bezel) -->
    <div class="preview-wrapper">
      <div class="laptop-bezel">
        <div class="screen-reflection"></div>
        <canvas id="previewCanvas" width="240" height="135"></canvas>
        <div class="preview-badge" id="previewBadge">↻ CW 1.0x</div>
      </div>
      <div class="laptop-base"></div>
    </div>

    <!-- Direction Selector (Clockwise, Anticlockwise, Dual Waves) -->
    <div class="dir-group">
      <button type="button" class="dir-btn" id="btn-cw" title="Single Light Wave Clockwise">
        <span class="icon">↻</span>
        <span>Clockwise</span>
      </button>
      <button type="button" class="dir-btn" id="btn-ccw" title="Single Light Wave Anticlockwise">
        <span class="icon">↺</span>
        <span>Anticlockwise</span>
      </button>
      <button type="button" class="dir-btn" id="btn-dual" title="Two Light Waves Moving In Opposite Directions Intersecting and Crossing">
        <span class="icon">⇄</span>
        <span>Dual Waves</span>
      </button>
    </div>

    <!-- Motion Controls -->
    <div class="row">
      <label>Animation Speed</label>
      <input type="range" id="waveSpeed" min="0.2" max="3.0" step="0.05">
      <span class="val-badge" id="waveSpeedVal">1.0x</span>
    </div>

    <div class="row">
      <label>Wave & Trail Length</label>
      <input type="range" id="waveLength" min="0.10" max="0.80" step="0.02">
      <span class="val-badge" id="waveLengthVal">35%</span>
    </div>

    <div class="row">
      <label>Glow Intensity</label>
      <input type="range" id="waveGlow" min="0.2" max="2.0" step="0.05">
      <span class="val-badge" id="waveGlowVal">100%</span>
    </div>

    <div class="row">
      <label>Border Thickness</label>
      <input type="range" id="waveThickness" min="4" max="50" step="1">
      <span class="val-badge" id="waveThicknessVal">18px</span>
    </div>

    <div class="row">
      <label>Wave Color Style</label>
      <select id="waveColorMode">
        <option value="rainbow">🌈 RGB Rainbow Spectrum</option>
        <option value="gradient">🎨 Dual Gradient (Color 1 → 2)</option>
        <option value="head-trail">✨ Luminous Head + Trail</option>
        <option value="solid">💡 Solid Neon Hue</option>
        <option value="sync">🎵 Sync with Audio Colors</option>
      </select>
    </div>

    <div class="row" id="row-wave-head">
      <label>Wave Head Color</label>
      <div class="color-picker-wrap">
        <input type="color" id="waveHeadColor">
      </div>
    </div>

    <div class="row" id="row-wave-c1">
      <label id="label-wave-c1">Wave Color 1</label>
      <div class="color-picker-wrap">
        <input type="color" id="waveColor1">
      </div>
    </div>

    <div class="row" id="row-wave-c2">
      <label id="label-wave-c2">Wave Color 2</label>
      <div class="color-picker-wrap">
        <input type="color" id="waveColor2">
      </div>
    </div>
  </div>

  <!-- CARD 2: Quick Presets (Hardware Synth Buttons) -->
  <div class="card">
    <div class="card-title" style="margin-bottom: 14px;">
      <span>🎨</span> Theme Presets
    </div>
    <div class="presets" id="presets"></div>
  </div>

  <!-- CARD 3: Audio Reactive Vibe -->
  <div class="card">
    <div class="card-header collapsible-header" id="audio-header">
      <div class="card-title">
        <span>🎵</span> Audio Edge Visualizer
      </div>
      <span class="collapse-arrow">▼</span>
    </div>

    <div class="collapsible-body" id="audio-body">
      <div class="row">
        <label>Visualizer Style</label>
        <select id="mode">
          <option value="bars">Bars</option>
          <option value="wave">Wave</option>
          <option value="glow">Glow</option>
          <option value="pulse">Pulse (Bass)</option>
          <option value="none">Off (Light Wave Only)</option>
        </select>
      </div>

      <div class="row">
        <label>Audio Color 1</label>
        <input type="color" id="color1">
      </div>

      <div class="row">
        <label>Audio Color 2</label>
        <input type="color" id="color2">
      </div>

      <div class="row">
        <label>Audio Rainbow Mode</label>
        <input type="checkbox" id="rainbow" style="accent-color: #0284c7; width: 18px; height: 18px;">
      </div>

      <div class="row">
        <label>Audio Sensitivity</label>
        <input type="range" id="sensitivity" min="0.3" max="3" step="0.05">
        <span class="val-badge" id="sensitivityVal">1.30</span>
      </div>

      <div class="row">
        <label>Audio Height / Size</label>
        <input type="range" id="thickness" min="40" max="400" step="5">
        <span class="val-badge" id="thicknessVal">140px</span>
      </div>

      <div class="row">
        <label>Audio Smoothness</label>
        <input type="range" id="smoothing" min="0.2" max="0.92" step="0.01">
        <span class="val-badge" id="smoothingVal">0.70</span>
      </div>

      <div style="margin-top: 16px; margin-bottom: 10px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 0.06em;">
        Active Audio Edges
      </div>
      <div class="edges-grid">
        <label class="edge-checkbox"><input type="checkbox" id="edge-top"> Top Edge</label>
        <label class="edge-checkbox"><input type="checkbox" id="edge-bottom"> Bottom Edge</label>
        <label class="edge-checkbox"><input type="checkbox" id="edge-left"> Left Edge</label>
        <label class="edge-checkbox"><input type="checkbox" id="edge-right"> Right Edge</label>
      </div>
    </div>
  </div>

  <!-- CARD 4: Displays & System -->
  <div class="card">
    <div class="card-title" style="margin-bottom: 14px;">
      <span>🖥️</span> Displays & System
    </div>
    <div class="row">
      <label>Display Target</label>
      <select id="displayMode">
        <option value="all">All Connected Displays</option>
        <option value="primary">Primary Display Only</option>
      </select>
    </div>
    <div class="row">
      <label>Start with Windows (Auto-launch)</label>
      <label class="switch">
        <input type="checkbox" id="autoStart">
        <span class="slider"></span>
      </label>
    </div>
  </div>

<script src="panel.js"></script>
</body>
</html>
